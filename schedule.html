<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقويم الأسبوع</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --today-bg: #0369a1;
            --today-border: #38bdf8;
            --alert-bg: #065f46;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--accent-color);
            font-size: 20px;
            margin-bottom: 20px;
        }
        .nav-links {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
        }
        .nav-btn {
            flex: 1;
            text-align: center;
            padding: 10px 5px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
        }
        .nav-btn.active {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
        }
        .alert-box {
            background-color: var(--alert-bg);
            border: 1px solid #10b981;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .alert-title {
            font-weight: bold;
            color: #34d399;
            margin-bottom: 4px;
        }
        .day-section {
            background-color: var(--card-bg);
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }
        .day-section.today {
            background-color: var(--today-bg);
            border: 2px solid var(--today-border);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        .day-title {
            color: var(--accent-color);
            font-size: 16px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        .today .day-title {
            color: #ffffff;
            border-bottom-color: rgba(255,255,255,0.3);
            font-weight: bold;
        }
        .day-item {
            font-size: 13px;
            color: #cbd5e1;
            margin: 6px 0;
            background: #0f172a;
            padding: 8px;
            border-radius: 6px;
        }
        .today .day-item {
            background: #1e293b;
            color: #f8fafc;
        }
        .no-data {
            text-align: center;
            color: #94a3b8;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>تقويم الأسبوع ☁️</h1>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">تسجيل درس</a>
            <a href="view.html" class="nav-btn">الجدول التفصيلي</a>
            <a href="schedule.html" class="nav-btn active">تقويم الأسبوع</a>
        </div>

        <div id="nextLessonAlert"></div>

        <div id="scheduleContainer">
            <div class="no-data">جاري تحميل التقويم...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAsDDAP9-TTec22K_3XknHUO3GS4u4U-pc",
          authDomain: "schoollessons-4dc1a.firebaseapp.com",
          projectId: "schoollessons-4dc1a",
          storageBucket: "schoollessons-4dc1a.firebasestorage.app",
          messagingSenderId: "467824837137",
          appId: "1:467824837137:web:fb507e6f90e03ee57e27b0",
          measurementId: "G-4XTWCG055R"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const daysOfWeek = ["السبت", "الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة"];

        function getCurrentDayName() {
            // JavaScript getDay(): الأحد(0), الإثنين(1), الثلاثاء(2), الأربعاء(3), الخميس(4), الجمعة(5), السبت(6)
            const mapDays = {
                6: "السبت",
                0: "الأحد",
                1: "الإثنين",
                2: "الثلاثاء",
                3: "الأربعاء",
                4: "الخميس",
                5: "الجمعة"
            };
            const now = new Date();
            return mapDays[now.getDay()];
        }

        async function loadSchedule() {
            const container = document.getElementById('scheduleContainer');
            const alertBox = document.getElementById('nextLessonAlert');
            const todayName = getCurrentDayName();

            try {
                const querySnapshot = await getDocs(collection(db, "lessons"));
                let lessons = [];
                querySnapshot.forEach((doc) => {
                    lessons.push(doc.data());
                });

                container.innerHTML = '';
                let todayLessons = [];

                daysOfWeek.forEach(day => {
                    let dayLessons = lessons.filter(l => l.days && l.days.includes(day));
                    
                    if (day === todayName) {
                        todayLessons = dayLessons;
                    }

                    let isToday = (day === todayName);
                    let sectionClass = isToday ? "day-section today" : "day-section";
                    let badge = isToday ? ' <span style="background:#38bdf8; color:#0f172a; padding:1px 6px; border-radius:4px; font-size:11px;">اليوم</span>' : '';

                    let html = `<div class="${sectionClass}">
                        <div class="day-title">${day} ${badge}</div>`;
                    
                    if (dayLessons.length === 0) {
                        html += `<div class="day-item" style="color: #64748b;">لا توجد دروس في هذا اليوم</div>`;
                    } else {
                        dayLessons.forEach(l => {
                            let teacherInfo = l.teacher ? `${l.teacher}` : 'غير محدد';
                            if(l.teacherPhone) teacherInfo += ` 📞 (${l.teacherPhone})`;
                            
                            html += `<div class="day-item">
                                <strong>${l.student}</strong> - ${l.subject} (${teacherInfo}) 
                                <br><span style="color:var(--accent-color);">⏰ ${l.time || 'وقت غير محدد'}</span>
                            </div>`;
                        });
                    }
                    html += `</div>`;
                    container.innerHTML += html;
                });

                if (todayLessons.length > 0) {
                    todayLessons.sort((a, b) => (a.time || "23:59").localeCompare(b.time || "23:59"));
                    let nextLesson = todayLessons[0];
                    let teacherStr = nextLesson.teacher || 'غير محدد';
                    if(nextLesson.teacherPhone) teacherStr += ` 📞 (${nextLesson.teacherPhone})`;
                    
                    alertBox.innerHTML = `
                        <div class="alert-box">
                            <div class="alert-title">🔔 تنبيه أقرب موعد درس اليوم (${todayName}):</div>
                            <div>الطالب: <strong>${nextLesson.student}</strong> | المادة: <strong>${nextLesson.subject}</strong></div>
                            <div>المدرس: ${teacherStr} | الساعة: <span style="color:#fde047; font-weight:bold;">${nextLesson.time || 'غير محدد'}</span></div>
                        </div>
                    `;
                } else {
                    alertBox.innerHTML = `
                        <div class="alert-box" style="background-color: #1e293b; border-color: #334155;">
                            <div class="alert-title" style="color: #94a3b8;">استراحة اليوم:</div>
                            <div>لا توجد أي دروس مسجلة لجلسات اليوم (${todayName}).</div>
                        </div>
                    `;
                }

            } catch (e) {
                console.error(e);
                container.innerHTML = '<div class="no-data">حدث خطأ في تحميل التقويم.</div>';
            }
        }

        loadSchedule();
    </script>
</body>
</html>
