<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجدول التفصيلي للدروس</title>
    <style>
        :root {
            --bg-color: #111827;
            --card-bg: #1f2937;
            --nested-bg: #374151;
            --text-color: #f3f4f6;
            --accent-color: #22d3ee;
            --border-color: #4b5563;
            --danger-color: #ef4444;
        }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--accent-color);
            font-size: 22px;
            margin-bottom: 25px;
        }
        .nav-links {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .nav-btn {
            flex: 1;
            text-align: center;
            padding: 12px 5px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
        }
        .nav-btn.active {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
            font-weight: bold;
        }
        .selector-box {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent-color);
            font-size: 14px;
            font-weight: bold;
        }
        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
        }
        .student-info-header {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .student-phone {
            color: #94a3b8;
            font-size: 13px;
        }
        .teacher-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            position: relative;
        }
        .teacher-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        .subject-name {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 15px;
        }
        .delete-btn {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }
        .info-row {
            font-size: 13px;
            color: #cbd5e1;
            margin: 5px 0;
        }
        .no-data {
            text-align: center;
            color: #9ca3af;
            margin-top: 40px;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>الجدول التفصيلي للدروس 🗓️</h1>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">تسجيل درس</a>
            <a href="view.html" class="nav-btn active">الجدول التفصيلي</a>
            <a href="schedule.html" class="nav-btn">تقويم الأسبوع</a>
        </div>

        <div class="selector-box">
            <label for="studentSelect">اختر اسم الطالب لعرض مدربيه:</label>
            <select id="studentSelect" onchange="displayStudentLessons()">
                <option value="">-- اختر الطالب --</option>
            </select>
        </div>

        <div id="lessonsContainer">
            <div class="no-data">الرجاء اختيار طالب من القائمة أعلاه لعرض دروسه.</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAsDDAP9-TTec22K_3XknHUO3GS4u4U-pc",
          authDomain: "schoollessons-4dc1a.firebaseapp.com",
          projectId: "schoollessons-4dc1a",
          storageBucket: "schoollessons-4dc1a.firebasestorage.app",
          messagingSenderId: "467824837137",
          appId: "1:467824837137:web:fb507e6f90e03ee57e27b0",
          measurementId: "G-4XTWCG055R"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allLessons = [];

        async function initData() {
            try {
                const querySnapshot = await getDocs(collection(db, "lessons"));
                allLessons = [];
                querySnapshot.forEach((document) => {
                    allLessons.push({ id: document.id, ...document.data() });
                });
                populateStudentDropdown();
            } catch (e) {
                console.error(e);
                document.getElementById('lessonsContainer').innerHTML = '<div class="no-data">خطأ في الاتصال بقاعدة البيانات.</div>';
            }
        }

        function populateStudentDropdown() {
            const select = document.getElementById('studentSelect');
            let students = [...new Set(allLessons.map(l => l.student))].filter(Boolean);
            
            select.innerHTML = '<option value="">-- اختر الطالب --</option>';
            students.forEach(st => {
                select.innerHTML += `<option value="${st}">${st}</option>`;
            });
        }

        window.displayStudentLessons = function() {
            const selectedStudent = document.getElementById('studentSelect').value;
            const container = document.getElementById('lessonsContainer');

            if (!selectedStudent) {
                container.innerHTML = '<div class="no-data">الرجاء اختيار طالب من القائمة أعلاه لعرض دروسه.</div>';
                return;
            }

            let studentLessons = allLessons.filter(l => l.student === selectedStudent);

            if (studentLessons.length === 0) {
                container.innerHTML = '<div class="no-data">لا توجد دروس مسجلة لهذا الطالب.</div>';
                return;
            }

            let phone = studentLessons[0].phone || 'غير مسجل';
            
            let html = `
                <div class="student-info-header">
                    <div>
                        <strong style="font-size: 16px; color: var(--accent-color);">${selectedStudent}</strong>
                        <div class="student-phone">📞 الهاتف: ${phone}</div>
                    </div>
                </div>
            `;

            studentLessons.forEach(item => {
                let teachersList = Array.isArray(item.teacher) ? item.teacher.join('، ') : (item.teacher || 'غير محدد');
                html += `
                    <div class="teacher-card">
                        <div class="teacher-header">
                            <span class="subject-name">📚 ${item.subject} (${item.book || 'بدون ملزمة'})</span>
                            <button class="delete-btn" onclick="deleteLesson('${item.id}')">حذف الدرس</button>
                        </div>
                        <div class="info-row"><strong>المدرس:</strong> ${teachersList}</div>
                        <div class="info-row"><strong>⏰ الوقت:</strong> ${item.time || 'غير محدد'}</div>
                        <div class="info-row"><strong>📅 الأيام:</strong> ${item.days ? item.days.join('، ') : 'غير محدد'}</div>
                        <div class="info-row"><strong>💰 المصاريف:</strong> ${item.cost || 0} جنيه</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        window.deleteLesson = async function(id) {
            if (confirm('هل أنت متأكد من حذف هذا الدرس نهائياً؟')) {
                try {
                    await deleteDoc(doc(db, "lessons", id));
                    await initData();
                    document.getElementById('studentSelect').value = "";
                    document.getElementById('lessonsContainer').innerHTML = '<div class="no-data">تم حذف الدرس. اختر الطالب مرة أخرى لتحديث القائمة.</div>';
                } catch (e) {
                    alert('فشل الحذف!');
                }
            }
        }

        initData();
    </script>
</body>
</html>
