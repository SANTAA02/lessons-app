<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دروس الأبناء</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
            --success-color: #22c55e;
            --danger-color: #f43f5e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            font-size: 20px;
            margin-bottom: 20px;
        }

        .nav-links {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
        }

        .nav-btn {
            flex: 1;
            text-align: center;
            padding: 10px 5px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        .nav-btn.active {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
        }

        /* خانة مزامنة تقويم جوجل الشاملة لكل الجدول */
        .ios-banner {
            background: linear-gradient(135deg, #1e40af, #2563eb);
            border: 1px solid #3b82f6;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .ios-banner-text {
            font-size: 13px;
            font-weight: bold;
            color: #eff6ff;
        }

        .btn-ios-top {
            background-color: #ffffff;
            color: #1e40af;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-ios-top:hover {
            background-color: #f3f4f6;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-size: 13px;
            color: #94a3b8;
        }

        input, select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .days-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .day-checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        button.btn-add {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
            transition: background 0.2s;
        }

        button.btn-add:hover {
            background-color: var(--accent-hover);
        }

        .alert-msg {
            display: none;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            line-height: 1.6;
        }
        .success-msg { background-color: var(--success-color); color: white; }
        .error-msg { background-color: var(--danger-color); color: white; }

        /* شاشة تسجيل الدخول */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.98);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-box {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .login-box h2 {
            text-align: center;
            color: var(--accent-color);
            margin-top: 0;
            font-size: 18px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>تسجيل الدخول للتطبيق 🔒</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="loginUser" placeholder="أدخل اسم المستخدم">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="loginPass" placeholder="أدخل كلمة المرور">
                </div>
                <div id="loginError" class="alert-msg error-msg" style="margin-top: 0;"></div>
                <button class="btn-add" onclick="checkLogin()">دخول</button>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>إضافة درس جديد (سحابي ☁️)</h1>

        <div class="nav-links">
            <a onclick="location.href='index.html'" class="nav-btn active">تسجيل درس</a>
            <a onclick="location.href='view.html'" class="nav-btn">الجدول التفصيلي</a>
            <a onclick="location.href='schedule.html'" class="nav-btn">تقويم الأسبوع</a>
        </div>

        <!-- خانة مزامنة تقويم جوجل المباشر -->
        <div class="ios-banner">
            <span class="ios-banner-text">📅 مزامنة الجدول مع تقويم جوجل</span>
            <button class="btn-ios-top" onclick="exportAllToGoogleCalendar()">إضافة لتقويم جوجل</button>
        </div>

        <div class="card">
            <div class="form-grid">
                <div class="form-group">
                    <label>اسم الطالب</label>
                    <input type="text" id="studentName" list="studentsList">
                    <datalist id="studentsList"></datalist>
                </div>
                <div class="form-group">
                    <label>المادة الدراسية</label>
                    <input type="text" id="subject">
                </div>
                <div class="form-group">
                    <label>اسم المدرس</label>
                    <input type="text" id="teacherName">
                </div>
                <div class="form-group">
                    <label>رقم تلفون المدرس</label>
                    <input type="tel" id="teacherPhone">
                </div>
                <div class="form-group">
                    <label>نوع الكتب / الملزمة</label>
                    <input type="text" id="bookType">
                </div>
                <div class="form-group">
                    <label>ساعة الدرس (انقر للاختيار)</label>
                    <input type="time" id="lessonTime">
                </div>
                <div class="form-group">
                    <label>مصاريف الدرس (جنيه)</label>
                    <input type="number" id="lessonCost">
                </div>
                
                <div class="form-group">
                    <label>أيام الدرس الأسبوعية</label>
                    <div class="days-selector" id="daysContainer">
                        <label class="day-checkbox"><input type="checkbox" value="السبت"> السبت</label>
                        <label class="day-checkbox"><input type="checkbox" value="الأحد"> الأحد</label>
                        <label class="day-checkbox"><input type="checkbox" value="الإثنين"> الإثنين</label>
                        <label class="day-checkbox"><input type="checkbox" value="الثلاثاء"> الثلاثاء</label>
                        <label class="day-checkbox"><input type="checkbox" value="الأربعاء"> الأربعاء</label>
                        <label class="day-checkbox"><input type="checkbox" value="الخميس"> الخميس</label>
                        <label class="day-checkbox"><input type="checkbox" value="الجمعة"> الجمعة</label>
                    </div>
                </div>

                <div id="alertMsg" class="alert-msg"></div>

                <button class="btn-add" onclick="addLesson()">حفظ الدرس أونلاين</button>
            </div>
        </div>
    </div>

    <script>
        const CORRECT_USER = "OSSAMA";
        const CORRECT_PASS = "147369";

        function checkLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const errorDiv = document.getElementById('loginError');

            if (user === CORRECT_USER && pass === CORRECT_PASS) {
                sessionStorage.setItem("appLoggedIn", "true");
                document.getElementById('loginOverlay').style.display = 'none';
            } else {
                errorDiv.innerHTML = "اسم المستخدم أو كلمة المرور غير صحيحة!";
                errorDiv.style.display = 'block';
            }
        }

        window.addEventListener('DOMContentLoaded', (event) => {
            if (sessionStorage.getItem("appLoggedIn") === "true") {
                document.getElementById('loginOverlay').style.display = 'none';
            } else {
                document.getElementById('loginOverlay').style.display = 'flex';
            }
        });

        document.getElementById('loginPass').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkLogin();
            }
        });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAsDDAP9-TTec22K_3XknHUO3GS4u4U-pc",
          authDomain: "schoollessons-4dc1a.firebaseapp.com",
          projectId: "schoollessons-4dc1a",
          storageBucket: "schoollessons-4dc1a.firebasestorage.app",
          messagingSenderId: "467824837137",
          appId: "1:467824837137:web:fb507e6f90e03ee57e27b0",
          measurementId: "G-4XTWCG055R"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchStudentsList() {
            try {
                const querySnapshot = await getDocs(collection(db, "lessons"));
                let students = new Set();
                querySnapshot.forEach((doc) => {
                    let data = doc.data();
                    if(data.student) students.add(data.student);
                });
                const datalist = document.getElementById('studentsList');
                datalist.innerHTML = '';
                students.forEach(st => {
                    datalist.innerHTML += `<option value="${st}">`;
                });
            } catch (e) {
                console.error("خطأ في جلب الطلاب: ", e);
            }
        }
        fetchStudentsList();

        function getSelectedDays() {
            const checkboxes = document.querySelectorAll('#daysContainer input[type="checkbox"]:checked');
            let days = [];
            checkboxes.forEach(cb => days.push(cb.value));
            return days;
        }

        function showAlert(text, type) {
            const msg = document.getElementById('alertMsg');
            msg.innerHTML = text;
            msg.className = `alert-msg ${type === 'success' ? 'success-msg' : 'error-msg'}`;
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 10000);
        }

        // دالة تصدير الملف كـ ICS معدل بالساعات الحقيقية والتنبيهات الصحيحة
        window.exportAllToGoogleCalendar = async function() {
            try {
                const querySnapshot = await getDocs(collection(db, "lessons"));
                if (querySnapshot.empty) {
                    alert("لا توجد دروس مسجلة في الجدول حالياً لتصديرها.");
                    return;
                }

                const dayMap = {
                    "السبت": "SA",
                    "الأحد": "SU",
                    "الإثنين": "MO",
                    "الثلاثاء": "TU",
                    "الأربعاء": "WE",
                    "الخميس": "TH",
                    "الجمعة": "FR"
                };

                let icsEvents = [];
                querySnapshot.forEach((doc) => {
                    let lesson = doc.data();
                    if (lesson.days && lesson.days.length > 0 && lesson.time) {
                        let byDays = lesson.days.map(d => dayMap[d]).filter(Boolean).join(",");
                        
                        // معالجة الساعات الصحيحة للبدء والانتهاء (ساعة ونصف افتراضياً أو ساعة)
                        let timeParts = lesson.time.split(":");
                        let startHour = timeParts[0];
                        let startMin = timeParts[1] || "00";
                        
                        // حساب ساعة النهاية (ساعة بعدها)
                        let endHourNum = (parseInt(startHour) + 1) % 24;
                        let endHour = String(endHourNum).padStart(2, '0');
                        let startTimeStr = `${startHour}${startMin}00`;
                        let endTimeStr = `${endHour}${startMin}00`;

                        let eventBlock = `BEGIN:VEVENT
SUMMARY:درس ${lesson.subject || 'بدون مادة'} (${lesson.student || 'طالب'})
DESCRIPTION:المدرس: ${lesson.teacher || 'غير محدد'}\\nرقم التليفون: ${lesson.teacherPhone || 'لا يوجد'}\\nالمصاريف: ${lesson.cost || 0} جنيه
DTSTART;TZID=Africa/Cairo:20260727T${startTimeStr}
DTEND;TZID=Africa/Cairo:20260727T${endTimeStr}
RRULE:FREQ=WEEKLY;BYDAY=${byDays}
BEGIN:VALARM
TRIGGER:-PT15M
ACTION:DISPLAY
DESCRIPTION:تنبيه: ميعاد درس ${lesson.subject || 'المادة'} بعد 15 دقيقة
END:VALARM
END:VEVENT`;
                        icsEvents.push(eventBlock);
                    }
                });

                if (icsEvents.length === 0) {
                    alert("لا توجد بيانات مواعيد صحيحة لتصديرها.");
                    return;
                }

                let icsContent = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//School Lessons Scheduler//AR
CALSCALE:GREGORIAN
METHOD:PUBLISH
${icsEvents.join("\n")}
END:VCALENDAR`;

                let blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8;' });
                let link = document.createElement('a');
                link.href = window.URL.createObjectURL(blob);
                link.setAttribute('download', `school_schedule_corrected.ics`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                showAlert('تم تحميل ملف المواعيد بالساعات الصحيحة! افتحه ليدخل التقويم بكل دقة وتنبيبات 15 دقيقة 🚀', 'success');

            } catch (e) {
                console.error("خطأ أثناء جلب الجدول للتقويم:", e);
                alert("حدث خطأ أثناء تحميل الجدول، حاول مرة أخرى.");
            }
        }

        window.addLesson = async function() {
            const student = document.getElementById('studentName').value.trim();
            const subject = document.getElementById('subject').value.trim();
            const teacher = document.getElementById('teacherName').value.trim();
            const teacherPhone = document.getElementById('teacherPhone').value.trim();
            const book = document.getElementById('bookType').value.trim();
            const days = getSelectedDays();
            const time = document.getElementById('lessonTime').value;
            const cost = document.getElementById('lessonCost').value.trim();

            if (!student || !subject || !teacher) {
                showAlert('الرجاء إدخال اسم الطالب، المادة، والمدرس على الأقل', 'error');
                return;
            }

            if (days.length === 0) {
                showAlert('الرجاء اختيار يوم واحد على الأقل للدرس', 'error');
                return;
            }

            if (!time) {
                showAlert('الرجاء تحديد ساعة الدرس لفحص تعارض المواعيد', 'error');
                return;
            }

            let conflictFound = null;
            try {
                const querySnapshot = await getDocs(collection(db, "lessons"));
                querySnapshot.forEach((doc) => {
                    let existing = doc.data();
                    if (existing.student && existing.student.trim().toLowerCase() === student.toLowerCase() && existing.time === time) {
                        let commonDays = days.filter(d => existing.days && existing.days.includes(d));
                        if (commonDays.length > 0) {
                            conflictFound = {
                                day: commonDays[0],
                                subject: existing.subject,
                                teacher: existing.teacher || 'غير محدد'
                            };
                        }
                    }
                });
            } catch (e) {
                console.error("خطأ في التحقق من التعارض:", e);
            }

            if (conflictFound) {
                showAlert(`⚠️ <strong>انتبه! الميعاد محجوز بالفعل.</strong><br>الطالب <strong>${student}</strong> لديه مادة (<strong>${conflictFound.subject}</strong>) مع (${conflictFound.teacher}) يوم <strong>${conflictFound.day}</strong> الساعة <strong>${time}</strong>.`, 'error');
                return;
            }

            const newLesson = {
                student,
                subject,
                teacher,
                teacherPhone,
                book,
                days,
                time,
                cost: cost ? Number(cost) : 0,
                createdAt: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, "lessons"), newLesson);
                showAlert('تم حفظ الدرس بنجاح في السحابة أونلاين! 🚀', 'success');

                document.getElementById('studentName').value = '';
                document.getElementById('subject').value = '';
                document.getElementById('teacherName').value = '';
                document.getElementById('teacherPhone').value = '';
                document.getElementById('bookType').value = '';
                document.getElementById('lessonTime').value = '';
                document.getElementById('lessonCost').value = '';
                document.querySelectorAll('#daysContainer input[type="checkbox"]').forEach(cb => cb.checked = false);
                
                await fetchStudentsList();
            } catch (e) {
                console.error("خطأ أثناء الإضافة: ", e);
                showAlert('حدث خطأ أثناء الحفظ بالسحابة، حاول مرة أخرى.', 'error');
            }
        }
    </script>
</body>
</html>
